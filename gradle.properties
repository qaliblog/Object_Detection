org.gradle.jvmargs=-Xmx1536m
android.enableJetifier=true
android.useAndroidX=true

# Network settings for better connectivity
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.connectionTimeout=120000
systemProp.http.socketTimeout=120000
systemProp.https.connectionTimeout=120000
systemProp.https.socketTimeout=120000

# Gradle performance settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# Suppress compileSdk warning
android.suppressUnsupportedCompileSdk=34

# Termux-specific settings for native library issues
kapt.use.worker.api=false
kapt.incremental.apt=false
kapt.include.compile.classpath=false

# Disable problematic native libraries for Termux
systemProp.sqlite.enable.loadable.extensions=false
systemProp.sqlite.enable.fts5=false
systemProp.sqlite.enable.json1=false

# Offline mode (uncomment if needed)
# org.gradle.offline=true
